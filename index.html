<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acceso privado</title>
<style>
:root{--bg:#121110;--card:#1c1a18;--ink:#f3eee6;--muted:#a59d92;--line:#34302b;--accent:#f0a93b;--bad:#ff8a7a}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f2ec;--card:#fff;--ink:#1d1a16;--muted:#6b6358;--line:#e2dbd0;--accent:#c97a10;--bad:#c0392b}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.gate{min-height:100vh;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:999px;background:var(--accent);color:#1a1206;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);min-height:1.2em}
</style>
</head>
<body>
<div class="gate">
<form id="f" autocomplete="on">
  <h1>Página privada</h1>
  <p>Ingresá la contraseña para verla.</p>
  <input type="text" name="username" value="pagina" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Contraseña" required autofocus>
  <label class="rem"><input type="checkbox" id="rem" checked> Recordarla en este dispositivo</label>
  <button id="go">Entrar</button>
  <p class="err" id="err" role="alert"></p>
</form>
</div>

      const raw = enc(await crypto.subtle.exportKey("raw", key));
      const keep = document.getElementById("rem").checked;
      await unlock(key, () => store.set(raw, keep));
    }catch(x){
      b.disabled = false; b.textContent = "Entrar"; err.textContent = "Contraseña incorrecta.";
    }
  };
})();
