<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acceso privado</title>
<style>
:root{--bg:#121110;--card:#1c1a18;--ink:#f3eee6;--muted:#a59d92;--line:#34302b;--accent:#f0a93b;--bad:#ff8a7a}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f2ec;--card:#fff;--ink:#1d1a16;--muted:#6b6358;--line:#e2dbd0;--accent:#c97a10;--bad:#c0392b}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.gate{min-height:100vh;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:999px;background:var(--accent);color:#1a1206;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);min-height:1.2em}
</style>
</head>
<body>
<div class="gate">
<form id="f" autocomplete="on">
  <h1>Página privada</h1>
  <p>Ingresá la contraseña para verla.</p>
  <input type="text" name="username" value="pagina" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Contraseña" required autofocus>
  <label class="rem"><input type="checkbox" id="rem" checked> Recordarla en este dispositivo</label>
  <button id="go">Entrar</button>
  <p class="err" id="err" role="alert"></p>
</form>
</div>

const LS = "clave:" + location.pathname;
const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const store = {
  get(){ try{ return localStorage.getItem(LS) || sessionStorage.getItem(LS); }catch(e){ return null; } },
  set(v, keep){ try{ (keep ? localStorage : sessionStorage).setItem(LS, v); }catch(e){} },
  del(){ try{ localStorage.removeItem(LS); sessionStorage.removeItem(LS); }catch(e){} }
};
async function derive(pw){
  const m = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:un(D.s), iterations:D.n, hash:"SHA-256"}, m, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function unlock(key, ok){
  let buf = null;
  for(const v of [{i:D.i, c:D.c}, ...(D.x || [])]){
    try{ buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:un(v.i)}, key, un(v.c)); break; }catch(e){}
  }
  if(!buf) throw new Error("clave");
  const html = new TextDecoder().decode(buf);
  if(ok) ok();
  installImages(key);
  document.open(); document.write(html); document.close();
}
/* Las fotos viven cifradas en e/<id>.bin: se descargan y descifran al vuelo */
function installImages(key){
  const RX = /(?:^|\/)e\/([0-9a-f]{16})\.bin(?:[?#].*)?$/, cache = {};
  const get = id => cache[id] || (cache[id] = fetch("e/" + id + ".bin").then(r => { if(!r.ok) throw 0; return r.arrayBuffer(); }).then(async buf => {
    const b = new Uint8Array(buf), p = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:b.slice(0,12)}, key, b.slice(12)));
    const ml = p[0], mime = new TextDecoder().decode(p.slice(1, 1 + ml));
    return URL.createObjectURL(new Blob([p.slice(1 + ml)], {type:mime}));
  }));
  const d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
  const swap = (img, v) => { const m = RX.exec(v || ""); if(!m) return false; img.__enc = v; get(m[1]).then(u => { if(img.__enc === v) d.set.call(img, u); }).catch(() => {}); return true; };
  Object.defineProperty(HTMLImageElement.prototype, "src", {configurable:true, get(){ return d.get.call(this); }, set(v){ if(!swap(this, v)) { this.__enc = null; d.set.call(this, v); } }});
  const sa = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function(n, v){ if(this instanceof HTMLImageElement && String(n).toLowerCase() === "src" && swap(this, v)) return; return sa.call(this, n, v); };
  /* imágenes que vengan escritas directo en el HTML */
  const scan = root => root.querySelectorAll && root.querySelectorAll("img[src]").forEach(i => swap(i, i.getAttribute("src")));
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if(n.nodeType === 1){ if(n.tagName === "IMG") swap(n, n.getAttribute("src")); scan(n); } }))).observe(document, {childList:true, subtree:true});
}
(async () => {
  /* esperar a que termine de cargar: si no, document.open no reemplaza la página */
  if(document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r));
  await new Promise(r => setTimeout(r, 0));
  const saved = store.get();
  if(saved){
    try{ await unlock(await crypto.subtle.importKey("raw", un(saved), "AES-GCM", true, ["decrypt"])); return; }
    catch(e){ store.del(); }
  }
  const f = document.getElementById("f"), b = document.getElementById("go"), err = document.getElementById("err");
  f.onsubmit = async e => {
    e.preventDefault(); err.textContent = ""; b.disabled = true; b.textContent = "Abriendo…";
    try{
      const key = await derive(document.getElementById("pw").value);
      const raw = enc(await crypto.subtle.exportKey("raw", key));
      const keep = document.getElementById("rem").checked;
      await unlock(key, () => store.set(raw, keep));
    }catch(x){
      b.disabled = false; b.textContent = "Entrar"; err.textContent = "Contraseña incorrecta.";
    }
  };
})();
